[package]
name = "history"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
extract = { version = "0.1.0", path = "../extract" }
git2 = { version = "0.21.0", default-features = false }
libz-sys = { version = "1.1.30", features = ["static"] }
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
